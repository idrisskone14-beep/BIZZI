<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05265c">
  <title>Bizzis - Hors ligne</title>
  <link rel="icon" href="assets/icon-192-v301.png">
  <style>
    :root {
      color: #071b3a;
      background: #f5f7fb;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(460px, 100%);
      border: 1px solid #dfe5ee;
      border-radius: 8px;
      padding: 24px;
      background: white;
      box-shadow: 0 18px 45px rgba(7, 27, 58, .1);
      display: grid;
      gap: 14px;
      text-align: center;
    }
    img {
      width: 92px;
      margin: 0 auto;
    }
    h1,
    p {
      margin: 0;
    }
    p {
      color: #69758a;
      line-height: 1.45;
    }
    a {
      min-height: 44px;
      border-radius: 999px;
      padding: 0 18px;
      display: inline-grid;
      place-items: center;
      color: white;
      background: #05265c;
      font-weight: 900;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img src="assets/icon-192-v301.png" alt="Bizzis">
    <h1>Connexion indisponible</h1>
    <p>Bizzis est installé, mais cette action nécessite une connexion. Revenez à l'accueil ou réessayez quand le réseau est disponible.</p>
    <a href="./index.html">Retour à Bizzis</a>
  </main>
</body>
</html>
