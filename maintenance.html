<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05265c">
  <meta name="robots" content="noindex">
  <title>Zeyds - Maintenance</title>
  <link rel="icon" href="/assets/icon-192-v305.png">
  <style>
    :root {
      color: #071b3a;
      background: #f5f7fb;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      box-sizing: border-box;
    }
    main {
      width: min(460px, 100%);
      border: 1px solid #dfe5ee;
      border-radius: 8px;
      padding: 28px 24px;
      background: white;
      box-shadow: 0 18px 45px rgba(7, 27, 58, .1);
      display: grid;
      gap: 14px;
      text-align: center;
      box-sizing: border-box;
    }
    img { width: 72px; height: 72px; margin: 0 auto; border-radius: 16px; }
    h1 { margin: 0; font-size: 1.35rem; }
    p { margin: 0; line-height: 1.5; color: #3b4a63; }
    .hint { font-size: .9rem; color: #6b7891; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/icon-192-v305.png" alt="Zeyds">
    <h1>Zeyds revient dans quelques minutes</h1>
    <p>Nous installons une nouvelle version, plus rapide. Vos demandes, vos favoris et vos opérations Zeyds Cash sont conservés.</p>
    <p class="hint">Cette page se recharge toute seule.</p>
  </main>
  <script>
    setTimeout(function () { location.replace("/"); }, 60000);
  </script>
</body>
</html>
